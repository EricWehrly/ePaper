<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ePaper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Ngrok Redirect Banner -->
  <div id="ngrokBanner" class="ngrok-banner" style="display: none;">
    <div class="banner-content">
      <div class="banner-message">
        <strong>🔒 OAuth Authentication Required</strong><br>
        Redirecting to secure HTTPS tunnel for Google Photos authentication...
      </div>
      <div class="banner-actions">
        <div class="countdown-section">
          <span class="countdown-text">Redirecting in: </span>
          <span id="bannerCountdown" class="countdown-timer">7</span>
          <span class="countdown-text">s</span>
        </div>
        <div class="banner-buttons">
          <button id="redirectNowBtn" class="banner-btn primary">Redirect Now</button>
          <button id="cancelRedirectBtn" class="banner-btn secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container">
    <h1>ePaper</h1>
    <div class="panel">
      <!-- Display section with preview and thumbnails -->
      <div class="display-section">
        <div class="display-box" id="displayBox">
        <div class="placeholder" id="placeholder">No image currently displayed</div>
        <img id="currentImage" src="" alt="Current display" style="display:none;"/>
        <div class="preview-overlay" id="previewOverlay" style="display:none;">
          <div class="spinner" id="spinner"></div>
        </div>
        <div class="preview-status" id="previewStatus" aria-live="polite"></div>

      </div>
        <div class="thumbs" id="thumbs">
          <div class="thumb-list" id="thumbList"></div>
        </div>
      </div>
      
      <!-- Controls section - separate box below display -->
      <div class="controls-box">
        <div class="controls primary-controls display-controls" id="primaryControls">
          <div class="mode-group control-group">
            <label>Mode:</label>
            <button class="ctl-btn control display-mode" data-mode="image" id="modeImageBtn" aria-pressed="true">Image</button>
            <button class="ctl-btn control display-mode" data-mode="carousel" id="modeCarouselBtn" aria-pressed="false">Carousel</button>
          </div>
          <div class="nav-group control-group">
            <button class="ctl-btn control display-control" id="prevBtn" title="Previous image">&lt;</button>
            <button class="ctl-btn control display-control" id="nextBtn" title="Next image">&gt;</button>
            <button class="ctl-btn control display-setting" id="autoplayToggle" data-playing="false">Autoplay: Off</button>
          </div>
        </div>
        <div class="controls secondary-controls display-controls" id="secondaryControls">
          <div class="orient-group control-group">
            <label for="orientationSelect">Orientation:</label>
            <select id="orientationSelect" class="control display-setting">
              <option value="portrait" selected>Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
            <button id="clearBtn" class="ctl-btn control display-control danger" title="Clear ePaper display">Clear</button>
          </div>
          <div class="countdown-group control-group">
            <label>Next in:</label>
            <span id="nextImageCountdown" class="countdown-display">--</span>
          </div>
          <div class="interval-group control-group">
            <label for="intervalInput">Interval (s):</label>
            <input id="intervalInput" class="control display-setting" type="number" min="5" step="1" value="30" />
          </div>
        </div>
      </div>
      
      <!-- Google Photos section -->
      <!-- Google Photos Section with Integrated Toggle Header -->
      <div class="google-photos-container">
        <!-- Toggle button as section header -->
        <div class="google-photos-toggle">
          <button id="toggleGooglePhotos" class="ctl-btn control">
            <img src="/static/icons/google_photos.png" alt="" class="button-icon">
            <span class="toggle-icon">^</span> Google Photos
          </button>
        </div>
        
        <!-- Expandable content -->
        <div class="google-photos-simple" id="googlePhotosSection" style="display:none;">
          <!-- Authentication and Picker Controls on Same Line -->
          <div class="controls-row" id="controlsRow">
            <div class="picker-section" id="pickerSection" style="display:none;">
              <button id="openPickerBtn" class="ctl-btn control primary">Open photo picker</button>
            </div>
            
            <div class="auth-section" id="authSection">
              <span id="authStatusText">Checking authentication...</span>
              <button id="loginBtn" class="ctl-btn control" style="display:none;">Sign In with Google</button>
              <button id="logoutBtn" class="ctl-btn control danger" style="display:none;">Sign Out</button>
            </div>
          </div>
          
          <!-- Status Text Underneath -->
          <div class="picker-status" id="pickerStatus" style="display:none;">
            <span id="pickerStatusText">Ready to select photos</span>
          </div>
            
          <div class="picker-results" id="pickerResults" style="display:none;">
            <!-- Results from picker will be displayed here -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/js/ngrok_banner.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/google_photos_simple.js"></script>
  <script>
    // Minimal module loader with performance.now() cache-buster
    (function(){
      const s = document.createElement('script');
      s.type = 'module';
      s.src = '/static/app.js?v=' + Math.floor(performance.now());
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
