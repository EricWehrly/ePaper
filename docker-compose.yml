services:
  epaper-display:
    build: .
    ports:
      - "80:80"       # HTTP (standard port)
      - "443:443"     # HTTPS (standard port)  
      - "5000:5000"   # HTTP (development port)
    volumes:
      # Mount config directory for credentials and SSL certificates
      - ./config:/app/config
      # Mount Let's Encrypt certificates (shared with certbot)
      - letsencrypt-certs:/etc/letsencrypt:ro
      # Mount pic directories for persistent storage
      - ./pic:/app/pic
      - ./pic-raw:/app/pic-raw
      # Mount logs for debugging
      - ./logs:/app/logs
      # GPIO access for e-Paper hardware
      - /sys/class/gpio:/sys/class/gpio
      - /sys/devices/platform:/sys/devices/platform
      - /sys:/sys:ro
    # Hardware access for e-Paper display
    privileged: true
    devices:
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/spidev0.1:/dev/spidev0.1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
    environment:
      - FLASK_ENV=development
      - PYTHONPATH=/app
      # Let's Encrypt cert paths (fallback to self-signed if not present)
      - SSL_CERT_PATH=/etc/letsencrypt/live/epaper.whirlwind.family/fullchain.pem
      - SSL_KEY_PATH=/etc/letsencrypt/live/epaper.whirlwind.family/privkey.pem
      - SSL_CERT_PATH_FALLBACK=/app/config/raspberrypi.local.crt
      - SSL_KEY_PATH_FALLBACK=/app/config/raspberrypi.local.key
    restart: unless-stopped
  
  # Let's Encrypt certificate management (automated with Route53 DNS)
  certbot:
    image: certbot/dns-route53
    volumes:
      # Share certificate storage with main app
      - letsencrypt-certs:/etc/letsencrypt
      - letsencrypt-lib:/var/lib/letsencrypt
      # Mount AWS credentials for Route53 DNS automation (managed by Terraform)
      - ./config/certbot-aws-credentials:/root/.aws/credentials:ro
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    # Initial cert request: docker compose run --rm certbot certonly --dns-route53 -d epaper.whirlwind.family --email eric@whirlwind.family --agree-tos
    # Auto-renewal: certbot renew runs every 12 hours and renews certs within 30 days of expiry
    entrypoint: ["/bin/sh", "-c"]
    command: ["trap 'exit 0' TERM; while :; do certbot renew --quiet && echo 'Certificate renewal check completed'; sleep 12h; done"]
    restart: unless-stopped
    
  # ngrok tunnel for Google OAuth (requires public domain)
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./config/ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - epaper-display
    environment:
      - NGROK_AUTHTOKEN_FILE=/etc/ngrok.yml
    
  # Chisel tunnel client - replaces inlets (works with existing AWS infrastructure)
  chisel-client:
    extends:
      file: ./infrastructure/chisel-client.yml
      service: chisel-client
    container_name: epaper-chisel-client
    depends_on:
      - epaper-display

  # Optional: Add a development container with hot reload
  epaper-dev:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
    # Run via project entrypoint so the dev container starts our app directly and supports
    # Python-level hot reload when using the built-in controller debug mode.
    command: python -m src.main --mode web --host 0.0.0.0 --port 5000 --debug
    profiles:
      - dev

# Named volumes for Let's Encrypt certificates
volumes:
  letsencrypt-certs:
    driver: local
  letsencrypt-lib:
    driver: local