version: '3.8'

services:
  # Local Chisel server for testing
  chisel-server-local:
    image: jpillora/chisel:latest
    container_name: epaper-chisel-server-test
    restart: unless-stopped
    ports:
      - "8080:8080"  # Chisel server port
      - "9090:9090"  # Forwarded local test port
    command: |
      server
      --host 0.0.0.0
      --port 8080
      --auth test:testpass123
      --reverse
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  # Chisel client for testing
  chisel-client-local:
    image: jpillora/chisel:latest  
    container_name: epaper-chisel-client-test
    restart: unless-stopped
    depends_on:
      - chisel-server-local
    command: |
      client
      --auth test:testpass123
      http://chisel-server-local:8080
      R:9090:epaper-display:5000
    networks:
      - epaper_default
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://chisel-server-local:8080", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  epaper_default:
    external: true