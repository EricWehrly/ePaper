version: '3.8'

services:
  inlets-client:
    image: inlets/inlets:latest
    container_name: epaper-inlets-client
    restart: unless-stopped
    env_file:
      - .env.inlets
    command: |
      client
      --remote=$${INLETS_REMOTE}
      --token=$${INLETS_TOKEN}
      --upstream=$${INLETS_UPSTREAM}
    networks:
      - epaper_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  epaper_default:
    external: true