services:
  epaper-display:
    build: .
    ports:
      - "80:80"       # HTTP (standard port)
      - "443:443"     # HTTPS (standard port)  
      - "5000:5000"   # HTTP (development port)
    volumes:
      # Mount config directory for credentials and SSL certificates
      - ./config:/app/config
      # Mount pic directories for persistent storage
      - ./pic:/app/pic
      - ./pic-raw:/app/pic-raw
      # Mount logs for debugging
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=development
      - PYTHONPATH=/app
      - SSL_CERT_PATH=/app/config/raspberrypi.local.crt
      - SSL_KEY_PATH=/app/config/raspberrypi.local.key
    restart: unless-stopped
    
  # ngrok tunnel for Google OAuth (requires public domain)
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./config/ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - epaper-display
    environment:
      - NGROK_AUTHTOKEN_FILE=/etc/ngrok.yml
    
  # Optional: Add a development container with hot reload
  epaper-dev:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
    command: flask run --host=0.0.0.0 --port=5000 --reload
    profiles:
      - dev